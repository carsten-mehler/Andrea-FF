<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Andrea FF</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell">
      <section id="arena" class="arena" tabindex="0" aria-label="Andrea FF Spielfeld">
        <img class="andrea-photo" src="Photo/IMG_1405.JPG" alt="Andrea am Wasser" draggable="false">
        <div class="photo-shade" aria-hidden="true"></div>

        <header class="hud" aria-live="polite">
          <div class="game-title">Andrea FF</div>
          <div class="meter">
            <span>Treffer</span>
            <strong id="hitCount">0</strong>
          </div>
          <div class="meter">
            <span>Schuesse</span>
            <strong id="shotCount">0</strong>
          </div>
        </header>

        <div class="launcher" aria-hidden="true">
          <div class="mini-pack pack-one">
            <img src="assets/fishermans-friend-pack.svg" alt="" draggable="false">
          </div>
          <div class="mini-pack pack-two">
            <img src="assets/fishermans-friend-pack.svg" alt="" draggable="false">
          </div>
          <div class="mini-pack pack-three">
            <img src="assets/fishermans-friend-pack.svg" alt="" draggable="false">
          </div>
        </div>

        <div id="effects" class="effects" aria-hidden="true"></div>

        <div id="crosshair" class="crosshair" aria-hidden="true">
          <span class="ring"></span>
          <span class="line line-top"></span>
          <span class="line line-right"></span>
          <span class="line line-bottom"></span>
          <span class="line line-left"></span>
          <span class="dot"></span>
        </div>

        <nav class="touch-controls" aria-label="Spielsteuerung">
          <div class="dpad" aria-label="Fadenkreuz bewegen">
            <button class="control up" type="button" data-control="ArrowUp" aria-label="Nach oben">^</button>
            <button class="control left" type="button" data-control="ArrowLeft" aria-label="Nach links">&lt;</button>
            <button class="control right" type="button" data-control="ArrowRight" aria-label="Nach rechts">&gt;</button>
            <button class="control down" type="button" data-control="ArrowDown" aria-label="Nach unten">v</button>
          </div>
          <button class="fire-button" type="button" data-control="fire" aria-label="Fisherman's Friend abschiessen">FIRE</button>
        </nav>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
